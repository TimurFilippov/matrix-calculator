name: Matrix Calculator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libgtest-dev valgrind doxygen
          
      - name: Configure project
        working-directory: ./matrix_calculator  # <--- ДОБАВЛЕНО
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        working-directory: ./matrix_calculator  # <--- ДОБАВЛЕНО
        run: cmake --build build --parallel 2

      - name: Run tests
        working-directory: ./matrix_calculator  # <--- ДОБАВЛЕНО
        run: ctest --test-dir build --verbose --output-on-failure
